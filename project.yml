name: MapPro
options:
  bundleIdPrefix: com.hengzm
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  MapPro:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MapPro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hengzm.mappro
        PRODUCT_NAME: MapPro
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: MapPro
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "MapPro uses your location to show where you are, find nearby places and build routes."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        CLANG_ANALYZER_NONNULL: "YES"
        ENABLE_STRICT_OBJC_MSGSEND: "YES"
        GCC_WARN_UNUSED_VARIABLE: "YES"

schemes:
  MapPro:
    build:
      targets:
        MapPro: all
    run:
      config: Debug
    archive:
      config: Release
