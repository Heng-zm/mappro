name: Build unsigned IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Archive and package MapPro
    runs-on: macos-15
    timeout-minutes: 30
    env:
      SCHEME: MapPro
      BUNDLE_ID: com.hengzm.mappro

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Show project
        run: xcodebuild -list -project MapPro.xcodeproj

      - name: Archive (unsigned)
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project MapPro.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/MapPro.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            EXPANDED_CODE_SIGN_IDENTITY=""

      - name: Package IPA
        id: package
        run: |
          set -euo pipefail
          APP_PATH="build/MapPro.xcarchive/Products/Applications/MapPro.app"
          test -d "$APP_PATH"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PATH/Info.plist")
          IPA_NAME="MapPro-${VERSION}-${BUILD}-unsigned.ipa"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          /usr/bin/zip -qry "$IPA_NAME" Payload
          shasum -a 256 "$IPA_NAME" | tee "$IPA_NAME.sha256"
          echo "ipa=$IPA_NAME" >> "$GITHUB_OUTPUT"
          echo "name=$IPA_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MapPro-unsigned-ipa
          path: |
            build/*.ipa
            build/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Logs/Build/*.xcactivitylog
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: MapPro ${{ steps.package.outputs.version }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            **MapPro ${{ steps.package.outputs.version }}** — a Google Maps-style iPhone app built with SwiftUI and the Apple Maps engine.

            This is an **unsigned IPA** built on GitHub Actions. It is not signed with an Apple Developer certificate.
            Install it with AltStore, Sideloadly, or your own signing workflow using your Apple ID.

            Includes: live search suggestions, nearby categories, place details, driving/walking/transit directions,
            route alternatives, turn-by-turn steps, traffic, map layers, 3D camera, long-press coordinate pins,
            coordinate search and copy, saved places, Look Around, and smooth native MapKit motion.
          files: |
            build/*.ipa
            build/*.sha256
          fail_on_unmatched_files: true
